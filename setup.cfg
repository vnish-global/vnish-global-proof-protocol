[metadata]
name = vnish-verify
version = 0.1.0
description = Offline-first SHA-256 and byte-size verification against VNISH GLOBAL manifest records
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = VNISH GLOBAL
url = https://vnish.global/data/
project_urls =
    Data = https://vnish.global/data/
    Documentation = https://vnish-global.github.io/vnish-global-proof-protocol/
    Issues = https://github.com/vnish-global/vnish-global-proof-protocol/issues
    Source = https://github.com/vnish-global/vnish-global-proof-protocol
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: System :: Systems Administration

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
vnish_verify = data/*.json

[options.entry_points]
console_scripts =
    vnish-verify = vnish_verify.cli:main
