name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build deterministic data
        run: python tools/build_dataset.py
      - name: Require clean generated data
        run: git diff --exit-code
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install source
        run: python -m pip install .
      - name: Check installed command and bundled manifest
        run: |
          vnish-verify --help
          python -c 'import importlib.resources, json; document = json.loads(importlib.resources.files("vnish_verify").joinpath("data/manifest.json").read_text()); assert document["record_count"] == 148'
